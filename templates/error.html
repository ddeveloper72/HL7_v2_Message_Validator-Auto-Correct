<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - HL7 v2 Message Validator</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    {% include '_design_system.html' %}
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <nav class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex h-16 max-w-7xl items-center px-4 sm:px-6 lg:px-8">
            <a class="flex items-center gap-2 font-semibold tracking-tight text-slate-900" href="/">
                <span class="flex size-9 items-center justify-center rounded-lg bg-brand-600 text-white">
                    <i data-lucide="shield-check" class="size-5" aria-hidden="true"></i>
                </span>
                HL7 Validator
            </a>
        </div>
    </nav>

    <main class="mx-auto flex max-w-3xl items-center justify-center px-4 py-16 sm:px-6 sm:py-24">
        <section class="w-full rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-panel sm:p-12">
            <div class="mx-auto flex size-16 items-center justify-center rounded-2xl bg-red-50 text-red-600 ring-1 ring-red-100">
                <i data-lucide="triangle-alert" class="size-8" aria-hidden="true"></i>
            </div>
            <h1 class="mt-6 text-3xl font-semibold tracking-tight text-slate-950">{{ error_title or 'Error' }}</h1>
            <p class="mx-auto mt-3 max-w-xl text-base leading-7 text-slate-600">{{ error_message or 'An unexpected error occurred.' }}</p>

            {% if details %}
            <div class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4 text-left">
                <div class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-slate-500">
                    <i data-lucide="terminal" class="size-4" aria-hidden="true"></i>
                    Technical details
                </div>
                <code class="mt-2 block break-words text-sm text-slate-700">{{ details }}</code>
            </div>
            {% endif %}

            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                {% if retry_url %}
                <a href="{{ retry_url }}" class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-brand-500 hover:text-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                    <i data-lucide="refresh-cw" class="size-4" aria-hidden="true"></i>
                    {{ retry_text or 'Try Again' }}
                </a>
                {% endif %}
                <a href="/" class="inline-flex items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
                    <i data-lucide="house" class="size-4" aria-hidden="true"></i>
                    Return to Home
                </a>
            </div>
        </section>
    </main>
</body>
</html>
