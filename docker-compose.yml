# HL7 v2 Message Validator - Docker Compose Configuration
# 
# QUICK START:
# 1. Copy .env.example to .env and configure your settings
# 2. Set APP_MODE below: 'local' for testing, 'production' for Azure integration
# 3. Run: docker-compose up -d
#
# For Azure AD authentication (production mode):
# - Register an app in Azure AD (https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps)
# - Configure redirect URI: http://localhost:5000/auth/callback (or your domain)
# - Copy Client ID, Client Secret, and Tenant ID to .env file
# - Set APP_MODE=production below
#
# For local testing (no Azure):
# - Set APP_MODE=local below
# - Only requires GAZELLE_API_KEY in .env

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl7-validator
    ports:
      - "5000:5000"
    environment:
      # ==================== APPLICATION MODE ====================
      # CHANGE THIS to switch between local and production modes
      # - 'local': No Azure AD or database (just API key needed)
      # - 'production': Full Azure integration with AD auth and SQL database
      - APP_MODE=${APP_MODE:-local}
      - ENVIRONMENT=docker
      
      # ==================== AZURE SQL DATABASE ====================
      # Required only if APP_MODE=production
      - AZURE_SQL_SERVER=${AZURE_SQL_SERVER}
      - AZURE_SQL_DATABASE=${AZURE_SQL_DATABASE}
      - AZURE_SQL_USERNAME=${AZURE_SQL_USERNAME}
      - AZURE_SQL_PASSWORD=${AZURE_SQL_PASSWORD}
      - DB_DRIVER=FreeTDS
      
      # ==================== SECURITY KEYS ====================
      # SESSION_SECRET_KEY: Required for all modes
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      # ENCRYPTION_KEY: Required only for production mode (database encryption)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # ==================== AZURE AD AUTHENTICATION ====================
      # Required only if APP_MODE=production
      # Setup instructions: https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
      - AZURE_AD_REDIRECT_URI=${AZURE_AD_REDIRECT_URI:-http://localhost:5000/auth/callback}
      
      # ==================== GAZELLE EVS API ====================
      # Required for all modes - get your API key from:
      # https://testing.ehealthireland.ie
      - GAZELLE_BASE_URL=${GAZELLE_BASE_URL:-https://testing.ehealthireland.ie}
      - GAZELLE_API_KEY=${GAZELLE_API_KEY}
      - GAZELLE_API_KEY_VALID_FROM=${GAZELLE_API_KEY_VALID_FROM}
      - GAZELLE_API_KEY_VALID_TO=${GAZELLE_API_KEY_VALID_TO}
      - VERIFY_SSL=${VERIFY_SSL:-true}
      
      # ==================== AUTO-CORRECTION SETTINGS ====================
      - MAX_AUTO_CORRECT_ITERATIONS=${MAX_AUTO_CORRECT_ITERATIONS:-10}
      - OPEN_REPORT_BROWSER=${OPEN_REPORT_BROWSER:-false}
      
    volumes:
      # Persistent storage for uploads and processed files
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./flask_session:/app/flask_session
      
    env_file:
      - .env
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - hl7-network

networks:
  hl7-network:
    driver: bridge
